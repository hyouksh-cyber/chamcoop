<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>로그인 - 공지·보도자료·사진 관리</title>
<style>
*{box-sizing:border-box}body{font-family:'Malgun Gothic',sans-serif;background:linear-gradient(135deg,#e8f3ec,#f6f9f7);margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{background:#fff;width:380px;max-width:94vw;padding:28px;border-radius:14px;box-shadow:0 4px 18px #0002}h1{font-size:20px;margin:0 0 4px;color:#1f6b4a}p.s{margin:0 0 16px;color:#777;font-size:13px}
label{display:block;margin:10px 0 4px;font-size:13px;font-weight:bold}input,select{width:100%;padding:10px;border:1px solid #bbb;border-radius:7px;font:inherit}
button{width:100%;margin-top:16px;padding:12px;border:0;border-radius:7px;background:#2e7d5b;color:#fff;font-size:16px;cursor:pointer}
.tabs{display:flex;margin-bottom:8px}.tabs a{flex:1;text-align:center;padding:8px;cursor:pointer;border-bottom:3px solid #ddd;color:#888}.tabs a.on{border-color:#2e7d5b;color:#2e7d5b;font-weight:bold}
#msg{margin-top:12px;font-size:14px;min-height:18px}.err{color:#c0392b}.ok{color:#1f7a4a}
</style></head><body><div class="card">
<h1>📂 공지·보도자료·사진 관리</h1><p class="s">기관을 선택하고 로그인하세요</p>
<div class="tabs"><a id="t1" class="on" onclick="tab(1)">로그인</a><a id="t2" onclick="tab(2)">회원가입</a></div>
<label>기관</label><select id="org"></select>
<label>아이디</label><input id="id" autocomplete="username">
<div id="reg" style="display:none"><label>이름</label><input id="name"><label>신청 직급</label>
<select id="role"><option value="staff">담당자</option><option value="admin">관리자</option><option value="mid">중간관리자 (최고관리자 승인)</option></select></div>
<label>비밀번호</label><input id="pw" type="password" autocomplete="current-password">
<button id="go" onclick="go()">로그인</button><div id="msg"></div></div>
<script>
let mode=1;const $=i=>document.getElementById(i);
async function api(a,d){const r=await fetch('api.php?a='+a,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d||{})});return r.json()}
function tab(m){mode=m;$('t1').className=m==1?'on':'';$('t2').className=m==2?'on':'';$('reg').style.display=m==2?'block':'none';$('go').textContent=m==1?'로그인':'가입 신청';$('msg').textContent=''}
function say(t,c){$('msg').className=c;$('msg').textContent=t}
async function init(){
 if(location.protocol==='file:'){say('파일을 직접 열었습니다. 주소창에 http://192.168.111.49:8000/chamcoop-upload/index.html 로 접속하세요.','err');return}
 let s;try{const r=await fetch('api.php?a=status');s=await r.json()}catch(e){say('서버(PHP)에 연결되지 않았습니다. api.php 파일이 같은 폴더에 있는지, NAS의 PHP가 켜져 있는지 확인하세요.','err');return}
 if(!s.setup){say('아직 설치 전입니다. 먼저 setup.php 를 실행해 최고관리자를 만드세요.','err');$('go').disabled=true;
  $('msg').insertAdjacentHTML('beforeend','<br><a href="setup.php">▶ 설치 화면으로 이동</a>');return}
 $('org').innerHTML=s.orgs.map(o=>`<option value="${o.id}">${o.name}</option>`).join('');
 const last=localStorage.getItem('lastOrg');if(last)$('org').value=last}
async function go(){const d={org:$('org').value,id:$('id').value,pw:$('pw').value};
 if(mode==2){d.name=$('name').value;d.role=$('role').value}
 const r=await api(mode==1?'login':'register',d);
 if(!r.ok)return say(r.error,'err');
 if(mode==1){localStorage.setItem('lastOrg',d.org);location.href='app.html'}else{say(r.msg,'ok');tab(1)}}
document.addEventListener('keydown',e=>{if(e.key==='Enter')go()});init();
</script></body></html>
